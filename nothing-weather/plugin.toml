# Nothing Weather — bloque de escritorio para Noctalia.
#
# Un solo [[desktop_widget]]: el clima actual y los tres dias siguientes, via Open-Meteo (sin API key). El tamano lo lleva su ajuste `scale`.
#
# La familia Nothing va un plugin por bloque porque Noctalia nombra los bloques
# con el `name` del manifiesto: un plugin por nombre distinto.

id           = "evergaster/nothing-weather"
name         = "Nothing Weather"
version      = "1.0.0"
plugin_api   = 26
author       = "evergaster"
license      = "MIT"
icon         = "cloud"
description  = "Bloque de escritorio estilo Nothing: el clima actual y los tres dias siguientes, via Open-Meteo (sin API key)."
tags         = ["desktop", "weather"]
dependencies = []

# El rojo de Nothing por defecto.
[[setting]]
key             = "accent"
type            = "color"
label_key       = "settings.accent.label"
description_key = "settings.accent.description"
default         = "#D71921"

[[desktop_widget]]
id    = "weather"
entry = "weather.luau"

  [[desktop_widget.setting]]
  key             = "scale"
  type            = "int"
  label_key       = "settings.scale.label"
  description_key = "settings.scale.description"
  default         = 100
  min             = 50
  max             = 300

  [[desktop_widget.setting]]
  key             = "temperature_unit"
  type            = "select"
  label_key       = "settings.temperature_unit.label"
  description_key = "settings.temperature_unit.description"
  default         = "metric"
  options = [
    { value = "metric", label_key = "settings.temperature_unit.options.metric" },
    { value = "imperial", label_key = "settings.temperature_unit.options.imperial" },
  ]

  [[desktop_widget.setting]]
  key             = "latitude"
  type            = "string"
  label_key       = "settings.latitude.label"
  description_key = "settings.latitude.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "longitude"
  type            = "string"
  label_key       = "settings.longitude.label"
  description_key = "settings.longitude.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "city"
  type            = "string"
  label_key       = "settings.city.label"
  description_key = "settings.city.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "weather_refresh_minutes"
  type            = "int"
  label_key       = "settings.weather_refresh_minutes.label"
  description_key = "settings.weather_refresh_minutes.description"
  default         = 30
  min             = 5
  max             = 180
