id           = "evergaster/opennothing"
name         = "Nothing Buds"
version      = "1.0.0"
plugin_api   = 24
author       = "evergaster"
license      = "MIT"
icon         = "ear"
description  = "Controla audifonos Nothing/CMF (ANC, graves, baja latencia, audio espacial y EQ) y muestra la bateria, usando openNothing."
tags         = ["audio", "bluetooth", "utility", "indicator"]
dependencies = ["opennothing"]

[[setting]]
key     = "command"
type    = "string"
label_key = "settings.command.label"
description_key = "settings.command.description"
default = "opennothing"

[[setting]]
key     = "mac"
type    = "string"
label_key = "settings.mac.label"
description_key = "settings.mac.description"
default = "2C:BE:EE:70:76:30"

[[setting]]
key     = "channel"
type    = "int"
label_key = "settings.channel.label"
description_key = "settings.channel.description"
default = 15
min     = 1
max     = 30

[[setting]]
key     = "model"
type    = "string"
label_key = "settings.model.label"
description_key = "settings.model.description"
default = "B172"

[[setting]]
key     = "timeout"
type    = "double"
label_key = "settings.timeout.label"
description_key = "settings.timeout.description"
default = 5.0
min     = 1.0
max     = 30.0

[[setting]]
key     = "poll_interval_ms"
type    = "int"
label_key = "settings.poll_interval_ms.label"
description_key = "settings.poll_interval_ms.description"
default = 60000
min     = 5000
max     = 300000

[[setting]]
key     = "scripted"
type    = "bool"
label_key = "settings.scripted.label"
description_key = "settings.scripted.description"
default = false

[[setting]]
key     = "show_percent"
type    = "bool"
label_key = "settings.show_percent.label"
description_key = "settings.show_percent.description"
default = true

[[setting]]
key     = "low_battery_threshold"
type    = "int"
label_key = "settings.low_battery_threshold.label"
description_key = "settings.low_battery_threshold.description"
default = 20
min     = 0
max     = 100

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "buds"
entry = "widget.luau"

[[panel]]
id        = "panel"
entry     = "panel.luau"
width     = 400
height    = 560
placement = "attached"
open_near_click = true