# Nothing — bloques de escritorio para Noctalia.
#
# Cuatro [[desktop_widget]] independientes, uno por bloque, para que cada cual
# ponga en el lienzo solo los que quiera: reloj de matriz de puntos, calendario
# del mes, clima y bateria del periferico elegido (audifonos, mouse, teclado).
#
# Cada bloque tiene su propio ajuste `scale`, asi que el reloj puede ser enorme
# y el clima pequeno en la misma pantalla. Posicion, tamano de la ficha y
# rotacion los controla Noctalia desde el editor de widgets de escritorio.
#
# Clima: Open-Meteo, sin API key. Coordenadas de [location] de Noctalia; si no
# hay, se usan las del bloque o se geocodifica la ciudad indicada.
# Bateria: BlueZ (busctl) y upower, leidos desde el propio bloque.

id           = "evergaster/nothing"
name         = "Nothing"
version      = "1.1.0"
plugin_api   = 26
author       = "evergaster"
license      = "MIT"
icon         = "dots"
description  = "Bloques de escritorio estilo Nothing: reloj de matriz de puntos, calendario, clima y bateria de los audifonos o el mouse. Anade solo los que quieras."
tags         = ["desktop", "clock", "calendar", "weather", "indicator"]
dependencies = ["upower", "bluez"]

# Compartido por los cuatro bloques: el rojo de Nothing por defecto.
[[setting]]
key             = "accent"
type            = "color"
label_key       = "settings.accent.label"
description_key = "settings.accent.description"
default         = "#D71921"

[[desktop_widget]]
id    = "clock"
entry = "clock.luau"

  [[desktop_widget.setting]]
  key             = "scale"
  type            = "int"
  label_key       = "settings.scale.label"
  description_key = "settings.scale.description"
  default         = 100
  min             = 50
  max             = 300

  [[desktop_widget.setting]]
  key             = "hour_format"
  type            = "select"
  label_key       = "settings.hour_format.label"
  description_key = "settings.hour_format.description"
  default         = "24"
  options = [
    { value = "24", label_key = "settings.hour_format.options.24" },
    { value = "12", label_key = "settings.hour_format.options.12" },
  ]

  [[desktop_widget.setting]]
  key             = "show_seconds"
  type            = "bool"
  label_key       = "settings.show_seconds.label"
  description_key = "settings.show_seconds.description"
  default         = false

[[desktop_widget]]
id    = "calendar"
entry = "calendar.luau"

  [[desktop_widget.setting]]
  key             = "scale"
  type            = "int"
  label_key       = "settings.scale.label"
  description_key = "settings.scale.description"
  default         = 100
  min             = 50
  max             = 300

  [[desktop_widget.setting]]
  key             = "week_start"
  type            = "select"
  label_key       = "settings.week_start.label"
  description_key = "settings.week_start.description"
  default         = "monday"
  options = [
    { value = "monday", label_key = "settings.week_start.options.monday" },
    { value = "sunday", label_key = "settings.week_start.options.sunday" },
  ]

[[desktop_widget]]
id    = "weather"
entry = "weather.luau"

  [[desktop_widget.setting]]
  key             = "scale"
  type            = "int"
  label_key       = "settings.scale.label"
  description_key = "settings.scale.description"
  default         = 100
  min             = 50
  max             = 300

  [[desktop_widget.setting]]
  key             = "temperature_unit"
  type            = "select"
  label_key       = "settings.temperature_unit.label"
  description_key = "settings.temperature_unit.description"
  default         = "metric"
  options = [
    { value = "metric", label_key = "settings.temperature_unit.options.metric" },
    { value = "imperial", label_key = "settings.temperature_unit.options.imperial" },
  ]

  [[desktop_widget.setting]]
  key             = "latitude"
  type            = "string"
  label_key       = "settings.latitude.label"
  description_key = "settings.latitude.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "longitude"
  type            = "string"
  label_key       = "settings.longitude.label"
  description_key = "settings.longitude.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "city"
  type            = "string"
  label_key       = "settings.city.label"
  description_key = "settings.city.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "weather_refresh_minutes"
  type            = "int"
  label_key       = "settings.weather_refresh_minutes.label"
  description_key = "settings.weather_refresh_minutes.description"
  default         = 30
  min             = 5
  max             = 180

[[desktop_widget]]
id    = "battery"
entry = "battery.luau"

  [[desktop_widget.setting]]
  key             = "scale"
  type            = "int"
  label_key       = "settings.scale.label"
  description_key = "settings.scale.description"
  default         = 100
  min             = 50
  max             = 300

  [[desktop_widget.setting]]
  key             = "device"
  type            = "string"
  label_key       = "settings.device.label"
  description_key = "settings.device.description"
  default         = ""

  [[desktop_widget.setting]]
  key             = "device_poll_seconds"
  type            = "int"
  label_key       = "settings.device_poll_seconds.label"
  description_key = "settings.device_poll_seconds.description"
  default         = 120
  min             = 30
  max             = 600

  [[desktop_widget.setting]]
  key             = "low_battery_threshold"
  type            = "int"
  label_key       = "settings.low_battery_threshold.label"
  description_key = "settings.low_battery_threshold.description"
  default         = 20
  min             = 0
  max             = 100
